[project]
name = "frootloopr"
version = "0.1.0"
description = "frootloopr: a multi-model agent orchestrator — a lead agent that wrangles claude/codex/gemini subagents, with shared notes, persistent memory, plan-first gating, and loop-until-check"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50",
    "mcp>=1.0",
]

[project.scripts]
frootloopr = "frootloopr.cli:main"
fl = "frootloopr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["frootloopr", "frootloopr.providers", "frootloopr.backends"]
